publish_to: "none"
version: 0.0.27

environment:
  sdk: ^3.12.2
  flutter: ^3.44.6

dependencies:
  device_info_plus: ^13.2.0
  flutter:
    sdk: flutter

  # permission_handler: ^12.0.0
  permission_handler:
    git:
