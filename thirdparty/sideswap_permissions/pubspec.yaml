  plugin_platform_interface: ^2.1.8
  sideswap_logger:
    git:
      url: https://github.com/sideswap-io/sideswap_logger.git
      ref: master

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
