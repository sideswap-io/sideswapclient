name: sideswap
description: Sideswap Client.
version: 1.9.1+5032
publish_to: none

environment:
  sdk: ^3.12.2
  flutter: ^3.44.6

dependencies:
  # git related dependencies
  sideswap_logger:
    git:
      url: https://github.com/sideswap-io/sideswap_logger.git
      ref: master
  sideswap_websocket:
    git:
      url: https://github.com/sideswap-io/sideswap_websocket.git
      ref: encryption
  window_size:
    git:
      url: https://github.com/google/flutter-desktop-embedding.git
      ref: a738913c8ce2c9f47515382d40827e794a334274
      path: plugins/window_size
  # path related dependencies
  candlesticks:
    path: thirdparty/candlesticks
  sideswap_notifications:
    path: thirdparty/sideswap_notifications/sideswap_notifications
  sideswap_notifications_platform_interface:
    path: thirdparty/sideswap_notifications/sideswap_notifications_platform_interface
  sideswap_permissions:
    path: thirdparty/sideswap_permissions
  sideswap_protobuf:
    path: thirdparty/sideswap_protobuf
  # normal dependencies
  animations: ^2.2.0
  another_flushbar: ^1.12.32
  app_links: ^7.2.1
  args: ^2.7.0
  cached_memory_image: ^1.5.0
  collection: ^1.19.1
  csv: ^8.0.0
  cupertino_icons: ^1.0.9
  decimal: ^3.2.5
  delayed_display: ^2.0.0
  dotted_line: ^3.3.0
  easy_localization: ^3.0.8
  easy_logger: ^0.0.2
  enum_to_string: ^2.2.1
  equatable: ^2.1.0
  faker: ^2.2.0
  ffi: ^2.2.0
  file_selector: ^1.1.0
  fixnum: ^1.1.1
  flutter_animate: ^4.5.2
  flutter_contacts: ^2.3.0
  flutter_hooks: ^0.21.3+1
  flutter_lints: ^6.0.0
  flutter_local_notifications: ^22.1.0
  flutter_plugin_android_lifecycle: ^2.0.35
  flutter_spinkit: ^5.2.2
  flutter_svg: ^2.3.0
  flutter_switch: ^0.3.2
  fpdart: ^1.2.0
  freezed_annotation: ^3.1.0
  hooks_riverpod: ^3.3.2
  riverpod: ^3.3.2
  http: ^1.6.0
  image: ^4.9.1
  image_picker: ^1.2.3
  json_annotation: ^4.12.0
  logger: ^2.7.0
  marquee_plus: ^2.2.4
  matrix4_transform: ^4.0.1
  mobile_scanner: ^7.4.0
  onboarding: ^4.0.2
  path_drawing: ^1.0.1
  path_provider: ^2.1.6
  pinput: ^6.0.2
  qr_flutter: ^4.1.0
  riverpod_annotation: ^4.0.3
  rxdart: ^0.28.0
  share_plus: ^13.2.1
  shared_preferences: ^2.5.5
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  shelf_web_socket: ^3.0.0
  sliding_up_panel: ^2.0.0+1
  tuple: ^2.0.2
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  web_socket_channel: ^3.0.3
  websocket_universal: ^1.3.0
  window_manager: ^0.5.2
  xrange: ^2.0.0
  mocktail: ^1.0.5
  # sdk dependencies
  flutter:
    sdk: flutter
  async: ^2.13.1
  flutter_cache_manager: ^3.4.2
  win32: ^6.3.0
  flutter_terms_viewer: ^1.0.2
  win32_registry: ^3.0.3

dev_dependencies:
  # normal dependencies
  build_runner: ^2.15.0
  freezed: ^3.2.5
  icons_launcher: ^3.1.0
  json_serializable: ^6.14.0
  pubm: ^0.3.0+1
  riverpod_generator: ^4.0.4
  riverpod_lint: ^3.1.4
  # test utilities — file system and platform mocking for provider tests
  file: ^7.0.1
  path_provider_platform_interface: ^2.1.3
  # sdk dependencies
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.3

# TEMPORARY: pin riverpod to the upstream fix for the "setState() called during
# build" crash when opening the desktop Send dialog (flushing a dirty provider
# during widget build). Fixed on riverpod master in commit 02b11c3 (#4816);
# not yet in a published release (latest is 3.3.2). Remove once a release with
# this fix is available and bump the normal constraints instead.
dependency_overrides:
  riverpod:
    git:
      url: https://github.com/rrousselGit/riverpod.git
      ref: 02b11c3fb12f7e2f07252c750ccca1edead81953
      path: packages/riverpod
  flutter_riverpod:
    git:
      url: https://github.com/rrousselGit/riverpod.git
      ref: 02b11c3fb12f7e2f07252c750ccca1edead81953
      path: packages/flutter_riverpod
  hooks_riverpod:
    git:
      url: https://github.com/rrousselGit/riverpod.git
      ref: 02b11c3fb12f7e2f07252c750ccca1edead81953
      path: packages/hooks_riverpod

